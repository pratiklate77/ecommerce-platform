# -----------------------------------------------------------------------------
# ECOMMERCE PLATFORM - FULL STACK ORCHESTRATION
#
# Wires the shared infrastructure (PostgreSQL, Redis, MailHog) together
# with the 7 containerized Spring Boot microservices on one bridge network.
#
# Quick reference:
#   docker compose config                # validate the file
#   docker compose build                 # build all images
#   docker compose up -d                 # start the whole stack
#   docker compose up -d <service_name>  # start ONE service (plus its deps)
#   docker compose logs -f <service_name># tail one service
#   docker compose ps                    # list services + health
#
# Per-service start (each pulls in only what it needs via depends_on):
#   docker compose up -d postgres redis mailhog      # infra only
#   docker compose up -d user-service                      # fronted by its DB
#   docker compose up -d api-gateway                       # starts last
#
# Credentials / external config live in the repo's .env (gitignored). Defaults
# below match local dev (ecommerce / ecommerce). Databases (user_db, product_db,
# inventory_db, order_db, payment_db) are created by infra/postgres/init once.
#
# The original infrastructure-only file is preserved at docker-compose.infra.yml.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Shared cross-service definitions (kept in top-level x-* extension fields so
# Docker Compose ignores them as services, while their YAML anchors can still be
# aliased via *app-healthcheck / *app-common throughout this file).

# Generic TCP healthcheck for the backend services (no Actuator dependency
# needed): opens a throwaway connection to the app's own port to confirm the
# server is listening. Each service sets TCK_PORT to its own port.
x-app-healthcheck: &app-healthcheck
  test: ["CMD-SHELL", "(exec 3<>/dev/tcp/127.0.0.1/$${TCK_PORT}) && echo ready || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 30s

# Common backend service keys (network attachment, restart policy, shared
# database credentials). Merged into each service via the *app-common anchor.
x-app-common: &app-common
  restart: unless-stopped
  networks:
    - ecommerce-net
  depends_on:
    postgres:
      condition: service_healthy
  environment: &app-common-env
    TZ: UTC
    POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    POSTGRES_HOST: postgres
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ecommerce}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}

services:

  # ============================ INFRASTRUCTURE ================================

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ecommerce 
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ecommerce-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    volumes:
      - mailhog-data:/maildir
    networks:
      - ecommerce-net

  # ============================ MICROSERVICES =================================
  # Each backend service merges the shared healthcheck + common keys (defined at
  # the top of this file) via the *app-healthcheck / *app-common anchors.

  # --- API Gateway (entry point, routes to the backends) ----------------------
  api-gateway:
    build:
      context: ./backend/api-gateway
    image: ecommerce/api-gateway:0.0.1
    container_name: ecommerce-api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *app-common-env
      SERVER_PORT: 8080
      TCK_PORT: 8080
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-32-byte-min-secret-key-for-hs256!!-dev-only}
      USER_SERVICE_HOST: user-service
      PRODUCT_SERVICE_HOST: product-service
      INVENTORY_SERVICE_HOST: inventory-service
      ORDER_SERVICE_HOST: order-service
      PAYMENT_SERVICE_HOST: payment-service
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
    <<: *app-common
    healthcheck: *app-healthcheck

  # --- user-service (8081) -> user_db, JWT ------------------------------------
  user-service:
    build:
      context: ./backend/user-service
    image: ecommerce/user-service:0.0.1
    container_name: ecommerce-user-service
    ports:
      - "8081:8081"
    environment:
      <<: *app-common-env
      SERVER_PORT: 8081
      TCK_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/user_db
      # Override these in .env for anything beyond local dev.
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-32-byte-min-secret-key-for-hs256!!-dev-only}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-28800000}
    depends_on:
      postgres:
        condition: service_healthy
    <<: *app-common
    healthcheck: *app-healthcheck

  # --- product-service (8082) -> product_db + JWT ----------------------------------
  product-service:
    build:
      context: ./backend/product-service
    image: ecommerce/product-service:0.0.1
    container_name: ecommerce-product-service
    ports:
      - "8082:8082"
    environment:
      <<: *app-common-env
      SERVER_PORT: 8082
      TCK_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/product_db
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-32-byte-min-secret-key-for-hs256!!-dev-only}
    depends_on:
      postgres:
        condition: service_healthy
    <<: *app-common
    healthcheck: *app-healthcheck

  # --- inventory-service (8083) -> inventory_db + JWT --------------------------
  inventory-service:
    build:
      context: ./backend/inventory-service
    image: ecommerce/inventory-service:0.0.1
    container_name: ecommerce-inventory-service
    ports:
      - "8083:8083"
    environment:
      <<: *app-common-env
      SERVER_PORT: 8083
      TCK_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/inventory_db
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-32-byte-min-secret-key-for-hs256!!-dev-only}
    depends_on:
      postgres:
        condition: service_healthy
    <<: *app-common
    healthcheck: *app-healthcheck

  # --- order-service (8084) -> order_db ---------------------------------------
  order-service:
    build:
      context: ./backend/order-service
    image: ecommerce/order-service:0.0.1
    container_name: ecommerce-order-service
    ports:
      - "8084:8084"
    environment:
      <<: *app-common-env
      SERVER_PORT: 8084
      TCK_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/order_db
    depends_on:
      postgres:
        condition: service_healthy
    <<: *app-common
    healthcheck: *app-healthcheck

  # --- payment-service (8085) -> payment_db -----------------------------------
  payment-service:
    build:
      context: ./backend/payment-service
    image: ecommerce/payment-service:0.0.1
    container_name: ecommerce-payment-service
    ports:
      - "8085:8085"
    environment:
      <<: *app-common-env
      SERVER_PORT: 8085
      TCK_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/payment_db
    depends_on:
      postgres:
        condition: service_healthy
    <<: *app-common
    healthcheck: *app-healthcheck

  # --- messaging-service (8086) -> Mail (SMTP) ---------------------------------
  messaging-service:
    build:
      context: ./backend/messaging-service
    image: ecommerce/messaging-service:0.0.1
    container_name: ecommerce-messaging-service
    ports:
      - "8086:8086"
    environment:
      <<: *app-common-env
      SERVER_PORT: 8086
      TCK_PORT: 8086
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
    depends_on:
      mailhog:
        condition: service_started
    <<: *app-common
    healthcheck: *app-healthcheck

  # --- frontend (React / Node 20) ---------------------------------------------
  frontend:
    build:
      context: ./frontend
    image: ecommerce/frontend:0.0.1
    container_name: ecommerce-frontend
    ports:
      - "8088:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# ============================== NETWORKS ======================================
networks:
  ecommerce-net:
    name: ecommerce-net
    driver: bridge

# ============================== VOLUMES =======================================
volumes:
  postgres-data:
  redis-data:
  mailhog-data:
