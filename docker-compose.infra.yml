# Local development infrastructure for the ecommerce microservices.
# Bring it up with:  docker compose up -d
#
# Exposed ports:
#   PostgreSQL      -> 5432   (contains one isolated database per owning service)
#   Redis           -> 6379
#   MailHog (SMTP)  -> 1025   (web UI on http://localhost:8025)
#
# Databases (one per microservice owner):
#   user_db, product_db, inventory_db, order_db, payment_db
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ecommerce-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    volumes:
      - mailhog-data:/maildir

volumes:
  postgres-data:
  redis-data:
  mailhog-data: