spring.application.name=user-service

# HTTP
server.port=8081

# Datasource (see docker-compose.yml / infra/postgres/init/01-create-databases.sql)
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# ddl-auto=update is convenient for local dev; switch to validate + Flyway in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT settings
# Secret MUST be at least 32 bytes for HS256. Override in your environment, never commit a real secret.
app.jwt.secret=change-me-to-a-32-byte-min-secret-key-for-hs256!!-dev-only
# Token lifetime in milliseconds (e.g. 8 hours)
app.jwt.expiration-ms=28800000
