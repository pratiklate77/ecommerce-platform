spring.application.name=product-service

# HTTP
server.port=8082

# Datasource (see docker-compose.yml / infra/postgres/init/01-create-databases.sql)
spring.datasource.url=jdbc:postgresql://ecommerce-postgres:5432/product_db
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# ddl-auto=update is convenient for local dev; switch to validate + Flyway in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT settings
# Shared with user-service (issuer) so product-service can verify its tokens.
app.jwt.secret=change-me-to-a-32-byte-min-secret-key-for-hs256!!-dev-only
