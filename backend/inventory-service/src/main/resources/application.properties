spring.application.name=inventory-service

# HTTP
server.port=8083

# Datasource (inventory_db created by infra/postgres/init)
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=ecommerce
spring.datasource.password=ecommerce
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT settings
# Shared with user-service (issuer) so inventory-service can verify its tokens.
app.jwt.secret=change-me-to-a-32-byte-min-secret-key-for-hs256!!-dev-only
